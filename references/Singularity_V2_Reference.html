const agentNames=['Document review','Correspondence drafting','File movement','Project monitoring','Approval workflow'];
function runAgent(){const task=tasks.find(t=>t.id===selected)||tasks[0];let ds=available().filter(d=>d.project===task.project).slice(0,4);if(!ds.length){toast('No connected sources for this task');return}let r={id:Date.now().toString(),agent,task:task.id,ids:ds.map(d=>d.id),status:'Awaiting approval',note:'',output:`${agent} — ${task.project}, ${task.district}\n${ds.map(d=>d.body).join('\n')}\nProposed next step: ${task.owner} to validate findings and submit the revised note for departmental review.`};s.runs.unshift(r);save();render()}
function agents(){return `<div class="content"><h1>Agents</h1><p class="muted">Run simulated workflows against the same workspace records.</p><div class="split"><div class="subnav"><small>AGENT DIRECTORY</small>${agentNames.map(a=>`<button data-agent="${esc(a)}" class="${agent===a?'active':''}">${esc(a)}</button>`).join('')}</div><div><h2>${esc(agent)}</h2><p>Retrieve related evidence, prepare a local draft and route it for human review.</p><label>Task <select id="agentTask" aria-label="Select task">${tasks.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label><p><button class="primary" data-action="runAgent">Run simulation</button></p><h2>Execution history</h2>${s.runs.map(r=>`<div class="box"><div class="row between"><strong>${esc(r.agent)}</strong><span class="tag">${esc(r.status)}</span></div><p class="muted">${esc(tasks.find(t=>t.id===r.task)?.title)}</p><div class="step"><b>1</b> Retrieved local source records</div><div class="step"><b>2</b> Prepared draft from evidence</div><div class="step"><b>3</b> Human review — ${esc(r.status)}</div><div class="paper" style="min-height:0;white-space:pre-wrap;padding:14px">${esc(r.output)}</div>${r.ids.map(id=>docBy(id)).filter(d=>d&&s.connected[d.source]).map(d=>`<button class="citation tiny" data-doc="${d.id}">${appicon(d.source)} ${esc(d.name)}</button>`).join('')}${r.status==='Awaiting approval'?`<form data-form="review" data-id="${r.id}"><textarea name="note" placeholder="Review comment (required for return or rejection)" aria-label="Review comment" style="width:100%;margin:10px 0"></textarea><div class="actions"><button class="primary" name="decision" value="Approved">Approve</button><button name="decision" value="Returned">Return</button><button name="decision" value="Rejected">Reject</button></div></form>`:`<p>Review comment: ${esc(r.note||'No comment')}</p>`}<small>Simulation only. No external action was performed.</small></div>`).join('')||'<div class="empty">No runs yet.</div>'}</div></div></div>`}
function library(){let ids=tab==='Saved'?s.saved:tab==='Recent'?s.recent:s.collections[tab]||[];return `<div class="content"><div class="row between"><h1>Library</h1><button data-action="newCollection">＋ Collection</button></div><div class="filters">${['Saved','Recent','Department records',...Object.keys(s.collections).filter(x=>x!=='Department records')].map(x=>`<button data-tab="${esc(x)}" class="${tab===x?'primary':''}">${esc(x)}</button>`).join('')}</div>${list(ids.map(docBy).filter(d=>d&&s.connected[d.source]))}</div>`}
function appsPage(){return `<div class="content"><h1>Apps</h1><p class="muted">Manage simulated enterprise and government sources.</p><form class="searchbar" data-form="apps"><input name="q" value="${esc(appQuery)}" placeholder="Find an application" aria-label="Find app"><button>Search</button></form><div class="appgrid">${apps.filter(a=>a.toLowerCase().includes(appQuery.toLowerCase())).map(a=>`<div class="appcard"><div class="row">${appicon(a)}<div><h3>${esc(a)}</h3><small>${docs.filter(d=>d.source===a).length} local records</small></div></div><span class="${s.connected[a]?'connected':'muted'}">${s.connected[a]?'● Connected (simulated)':'○ Disconnected'}</span><div class="actions"><button data-connect="${esc(a)}">${s.connected[a]?'Disconnect':'Connect'}</button><button data-config="${esc(a)}">Configure</button></div></div>`).join('')}</div></div>`}
function settings(){return `<div class="content narrow"><h1>Settings</h1><h2>Appearance</h2><button data-action="toggleTheme">Switch to ${s.theme==='light'?'dark':'light'} theme</button><h2>Workspace</h2><p>Fictional Assam government data · local reference demo</p><button data-action="reset">Reset local demo data</button></div>`}
function drawer(html){$('overlay').innerHTML=`<section class="drawer" role="dialog" aria-modal="true"><button class="close" data-action="close" aria-label="Close preview">×</button>${html}</section>`;$('overlay').hidden=false}
function preview(id){let d=docBy(id);if(!d||!s.connected[d.source]){toast('Source is disconnected');return}s.recent=[id,...s.recent.filter(x=>x!==id)].slice(0,20);save();drawer(`<p>${source(d.source)}</p><h2>${esc(d.name)}</h2><div class="meta">${d.id} · ${esc(d.owner)} · ${d.date}</div><div class="paper"><small>FICTIONAL GOVERNMENT RECORD · ${d.kind}</small><h2>${esc(d.project)} — ${esc(d.district)}</h2>${d.kind==='XLSX'?`<table><tr><th>Field</th><th>Record</th></tr><tr><td>Department</td><td>${esc(d.department)}</td></tr><tr><td>Finding</td><td>${esc(d.body)}</td></tr></table>`:`<p>${esc(d.body)}</p>`}<p class="muted">Prepared for demonstration purposes. Not an official government document.</p></div><div class="actions"><button data-save="${id}">${s.saved.includes(id)?'Remove saved':'Save document'}</button><button data-ask="${esc('Summarize '+d.project+' '+d.district)}">Ask assistant</button></div><form data-form="collection" data-id="${id}" class="row" style="margin-top:15px"><select name="collection" aria-label="Collection">${Object.keys(s.collections).map(x=>`<option>${esc(x)}</option>`).join('')}</select><button>Add to collection</button></form>`)}
function config(a){drawer(`<h2>${esc(a)}</h2><p>${source(a)} · simulated connector</p><p>Set a local configuration label. No external service is contacted.</p><form data-form="config" data-app="${esc(a)}"><label>Connection name<input name="label" value="${esc(s.configs[a]||a)}" required style="display:block;width:100%;margin:10px 0"></label><button class="primary">Save configuration</button></form>`)}
function close(){ $('overlay').hidden=true;render() }
function toggleTheme(){s.theme=s.theme==='dark'?'light':'dark';save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-doc],[data-save],[data-task],[data-ask],[data-chat],[data-agent],[data-tab],[data-connect],[data-config],[data-action]');if(!b)return;const d=b.dataset;if(d.nav){close();nav(d.nav)}else if(d.doc)preview(d.doc);else if(d.save){s.saved=s.saved.includes(d.save)?s.saved.filter(x=>x!==d.save):[d.save,...s.saved];save();if(!$('overlay').hidden)preview(d.save);else render();toast(s.saved.includes(d.save)?'Document saved':'Document removed')}else if(d.task){selected=d.task;nav('Work')}else if(d.ask){$('overlay').hidden=true;ask(d.ask)}else if(d.chat){chatId=d.chat;render()}else if(d.agent){agent=d.agent;render()}else if(d.tab){tab=d.tab;render()}else if(d.connect){s.connected[d.connect]=!s.connected[d.connect];if(filter===d.connect&&!s.connected[d.connect])filter='';save();render();toast('Local connector updated')}else if(d.config)config(d.config);else if(d.action){switch(d.action){case'close':close();break;case'newchat':chatId=null;render();break;case'clearFilters':filter=kind='';render();break;case'runAgent':runAgent();break;case'taskAgent':agent='Document review';nav('Agents');break;case'newCollection':drawer('<h2>New collection</h2><form data-form="newCollection"><input name="name" required placeholder="Collection name" aria-label="Collection name"><button class="primary">Create</button></form>');break;case'toggleTheme':toggleTheme();break;case'reset':if(confirm('Reset all local V2 data?')){localStorage.removeItem('singularity-v2');location.reload()}break;}}});
document.addEventListener('submit',e=>{let f=e.target;if(!f.dataset.form)return;e.preventDefault();let data=new FormData(f),v=String(data.get('q')||'').trim();switch(f.dataset.form){case'home':if(e.submitter?.value==='search'){q=v;nav('Search')}else ask(v);break;case'prompt':ask(v);break;case'search':q=v;render();break;case'apps':appQuery=v;render();break;case'config':s.configs[f.dataset.app]=String(data.get('label'));save();close();toast('Configuration saved locally');break;case'newCollection':{let n=String(data.get('name')).trim();if(!n||['Saved','Recent','__proto__','constructor','prototype'].includes(n)||Object.hasOwn(s.collections,n)){toast('Choose a unique collection name');return}s.collections[n]=[];tab=n;save();close();break}case'collection':{let a=String(data.get('collection'));if(!s.collections[a].includes(f.dataset.id))s.collections[a].push(f.dataset.id);save();toast('Added to collection');break}case'review':{let r=s.runs.find(x=>x.id===f.dataset.id),status=e.submitter?.value,note=String(data.get('note')||'').trim();if(!r||r.status!=='Awaiting approval')return;if(status!=='Approved'&&!note){toast('A review comment is required');return}r.status=status;r.note=note;s.tasks[r.task]=status==='Approved'?'Completed':status==='Returned'?'Returned':'Open';save();render();toast('Local review recorded');break}}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='sourceFilter'){filter=t.value;render()}if(t.id==='kindFilter'){kind=t.value;render()}if(t.id==='taskStatus'){s.tasks[selected]=t.value;save();render();toast('Task updated')}if(t.id==='agentTask'){selected=t.value;render()}});
$('collapse').onclick=()=>document.body.classList.toggle('collapsed');$('theme').onclick=toggleTheme;$('settings').onclick=()=>nav('Settings');$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)close();if(e.key==='Enter'&&e.target.matches('.task'))e.target.click()});
const initial=Object.keys(paths).find(n=>'#'+n.toLowerCase()===location.hash);if(initial)route=initial;render();
</script></body></html>
